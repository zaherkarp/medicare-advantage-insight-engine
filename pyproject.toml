[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-signal-monitor"
version = "0.1.0"
description = "Medicare Advantage news insight monitor with webhook-based alerting"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.13",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "responses>=0.23.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
]

[project.scripts]
ma-signal-monitor = "ma_signal_monitor.main:main"
ma-signal-digest = "ma_signal_monitor.digest:main"
ma-signal-build = "ma_signal_monitor.static_export:_cli"
ma-signal-discover = "ma_signal_monitor.discovery.cli:discover_main"
ma-signal-candidates = "ma_signal_monitor.discovery.cli:candidates_main"
ma-signal-feedback = "ma_signal_monitor.feedback_cli:main"
ma-signal-backfill = "ma_signal_monitor.backfill:main"
ma-signal-source-health = "ma_signal_monitor.source_health_cli:main"

[tool.setuptools.package-data]
ma_signal_monitor = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." puts the repo root on sys.path so the evals/ evaluation harness (a
# research subsystem, not a shipped package) is importable from its tests.
pythonpath = ["src", "."]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Pin the lint rule set to Ruff's historical default (pycodestyle E4/E7/E9 +
# Pyflakes F). CI installs Ruff unpinned, and newer Ruff releases broaden the
# implicit default set (0.16, for example, added flake8-datetimez, refurb, and
# more), which would fail the entire existing codebase on a version bump.
# Declaring the set explicitly keeps `ruff check` deterministic across versions.
select = ["E4", "E7", "E9", "F"]
