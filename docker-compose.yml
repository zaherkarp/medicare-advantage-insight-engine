# Self-hosted MA Signal Monitor: one container serving the web frontend and
# running scheduled ingestion against a shared SQLite volume.
services:
  web:
    build: .
    image: ma-signal-monitor:latest
    ports:
      - "8000:8000"
    environment:
      # Ingestion runs in-process on this interval (hours).
      INGEST_INTERVAL_HOURS: "6"
      RUN_SCHEDULER: "true"
      # Delivery is optional for the web product; default to dry-run.
      WEBHOOK_MODE: "${WEBHOOK_MODE:-test}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      MIN_RELEVANCE_SCORE: "${MIN_RELEVANCE_SCORE:-0.3}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      # Daily Briefing email digest (optional; the briefing always renders at
      # /briefing regardless). Set DIGEST_ENABLED=true and the SMTP_* vars to
      # email it on a daily schedule.
      DIGEST_ENABLED: "${DIGEST_ENABLED:-false}"
      DIGEST_HOUR: "${DIGEST_HOUR:-13}"
      DIGEST_TO: "${DIGEST_TO:-}"
      DIGEST_FROM: "${DIGEST_FROM:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    volumes:
      # Persist the story archive (and WAL files) across restarts.
      - ./data:/app/data
    restart: unless-stopped
