name: Scheduled Monitor Run

on:
  push:
    branches: [main]
  schedule:
    # Run every 3 hours at minute 15
    - cron: "15 */3 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Log level"
        required: false
        default: "INFO"
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING

permissions:
  contents: read

env:
  WEBHOOK_MODE: ${{ vars.WEBHOOK_MODE || 'ntfy' }}
  WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
  MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE || '0.3' }}
  LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
  USER_AGENT: ${{ vars.USER_AGENT || 'MA-Signal-Monitor (research; contact via repo)' }}
  # sec.gov 403s any User-Agent without a real contact email (see
  # fetchers/sec.py) — set as a secret so it's masked in logs. Configure at
  # Settings -> Secrets and variables -> Actions -> Secrets. See
  # docs/operations.md. Previously unset here entirely, silently falling back
  # to the config default, which sec.gov also rejects.
  SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}

jobs:
  monitor:
    name: Run Signal Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run monitor pipeline
        run: ma-signal-monitor

      - name: Upload run database
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: monitor-state-${{ github.run_id }}
          path: data/state.db
          retention-days: 7
          if-no-files-found: ignore
