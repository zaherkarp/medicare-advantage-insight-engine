name: Deploy Static Site

on:
  schedule:
    # Ingest + rebuild + deploy every 2 hours (at minute 25).
    - cron: "25 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/build_static.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Don't run deploys concurrently, but let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Project Pages live under /<repo>; the archive DB is restored from the
      # previously published site so it accumulates across runs.
      STATIC_BASE_PATH: /${{ github.event.repository.name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      WEBHOOK_MODE: test
      MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE || '0.3' }}
      USER_AGENT: ${{ vars.USER_AGENT || 'MA-Signal-Monitor (research; contact via repo)' }}
      # sec.gov 403s any User-Agent without a real contact email (see
      # fetchers/sec.py) — set as a secret, not a Variable, so it's masked in
      # logs. Configure at Settings -> Secrets and variables -> Actions ->
      # Secrets. See docs/operations.md.
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[web]"

      - name: Restore archive DB from the published site
        run: |
          mkdir -p data

          # Probe first so a genuine "nothing published yet" (404) can be told
          # apart from "the archive exists but I failed to fetch it" — a plain
          # curl failure used to collapse both into "start fresh", which meant
          # a transient Pages/CDN error would silently proceed with an empty
          # DB and later overwrite the real production archive. No -f here:
          # we want the actual status code, not curl failing on a 4xx/5xx.
          #
          # A 404 is the one status that lets the run proceed without a DB, so
          # it's the one a false positive would be fatal on: `compare` can't
          # catch it either, since a cold start has no prior row count to
          # compare against. Pages serves this file from a CDN and swaps the
          # whole site on each deploy, so a probe landing mid-swap can 404 for
          # an archive that really exists. Require the 404 to be stable across
          # spaced attempts before believing it; a genuine cold start stays
          # 404 on every attempt, while a swap-window blip resolves.
          # curl already prints 000 via -w on a connection-level failure, so
          # assign-then-default rather than `|| echo` (which would concatenate
          # a second 000 onto curl's own).
          probe() {
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -I \
              "$PAGES_URL/data/state.db" 2>/dev/null) || code="000"
            printf '%s' "${code:-000}"
          }

          status="$(probe)"
          if [ "$status" = "404" ]; then
            for attempt in 1 2 3; do
              sleep 10
              status="$(probe)"
              echo "Re-probe $attempt/3 after initial 404: HTTP $status"
              [ "$status" = "404" ] || break
            done
          fi

          if [ "$status" = "404" ]; then
            echo "No prior archive published (404 on 4 spaced probes) — legitimate cold start. Starting fresh."
            echo "ARCHIVE_ROWS_BEFORE=0" >> "$GITHUB_ENV"
          elif [ "$status" != "200" ]; then
            echo "::error::Archive probe for $PAGES_URL/data/state.db returned HTTP $status (expected 200 or 404)."
            echo "Aborting deliberately: proceeding would risk ingesting into an empty/partial DB and then overwriting the real published archive at publish time."
            exit 1
          else
            tmp_db="$(mktemp)"
            if ! curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 180 \
                 "$PAGES_URL/data/state.db" -o "$tmp_db"; then
              echo "::error::Failed to download the published archive after retries, even though it exists (HTTP 200 on probe)."
              echo "Aborting deliberately: proceeding with no/partial archive would overwrite the real production archive at publish time."
              exit 1
            fi
            if ! rows=$(python scripts/archive_guard.py validate "$tmp_db"); then
              echo "::error::Downloaded archive failed validation (corrupt, truncated, or missing the core table)."
              echo "Aborting deliberately: proceeding with a broken archive would overwrite the real production archive at publish time."
              exit 1
            fi
            mv "$tmp_db" data/state.db
            echo "Restored prior archive ($rows rows, $(stat -c%s data/state.db) bytes)."
            echo "ARCHIVE_ROWS_BEFORE=$rows" >> "$GITHUB_ENV"
          fi

      - name: Ingest latest signals
        run: ma-signal-monitor

      - name: Backfill categorization under current taxonomy
        run: ma-signal-backfill --rescore

      - name: Generate Daily Briefing (and email if configured)
        env:
          DIGEST_ENABLED: ${{ secrets.SMTP_HOST != '' && 'true' || 'false' }}
          PUBLIC_BASE_URL: ${{ env.PAGES_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: ma-signal-digest

      - name: Build static site
        env:
          # Public giscus values (not secrets) live in repo Variables — Settings
          # → Secrets and variables → Actions → Variables. Actions doesn't expose
          # them to steps automatically, so map them in here for build_static.py.
          # Only REPO + REPO_ID + CATEGORY_ID gate the widget (giscus_enabled).
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY || 'General' }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          GISCUS_THEME: ${{ vars.GISCUS_THEME || 'light' }}
        run: |
          python scripts/build_static.py --base-path "$STATIC_BASE_PATH" --out site
          # Last line of defense: refuse to publish if the archive shrank
          # catastrophically since the restore step (see archive_guard.py for
          # the tolerance and the retention-pruning evidence behind it).
          python scripts/archive_guard.py compare --before "$ARCHIVE_ROWS_BEFORE" --after data/state.db
          # Persist the DB inside the published site so the next run restores it.
          mkdir -p site/data
          cp data/state.db site/data/state.db

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type: GitHub Actions) so the workflow is
          # self-bootstrapping — no manual Settings → Pages toggle needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
