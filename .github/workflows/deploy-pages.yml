name: Deploy Static Site

on:
  schedule:
    # Ingest + rebuild + deploy every 2 hours (at minute 25).
    - cron: "25 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/build_static.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Don't run deploys concurrently, but let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Project Pages live under /<repo>. PAGES_URL feeds PUBLIC_BASE_URL for
      # the Daily Briefing digest's absolute links below; it is NOT how the
      # archive DB is restored or persisted (see "Restore archive DB from
      # cache" / "Save archive DB to cache" below). The DB used to round-trip
      # through this URL, but it is no longer published at all, so that path
      # stopped existing rather than merely moving.
      STATIC_BASE_PATH: /${{ github.event.repository.name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      WEBHOOK_MODE: test
      MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE || '0.3' }}
      USER_AGENT: ${{ vars.USER_AGENT || 'MA-Signal-Monitor (research; contact via repo)' }}
      # sec.gov 403s any User-Agent without a real contact email (see
      # fetchers/sec.py) — set as a secret, not a Variable, so it's masked in
      # logs. Configure at Settings -> Secrets and variables -> Actions ->
      # Secrets. See docs/operations.md.
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install ".[web]"

      - name: Restore archive DB from cache
        id: restore-cache
        uses: actions/cache/restore@v5
        with:
          path: data/state.db
          # Every run's primary key embeds this run's own id (run_attempt
          # disambiguates a manual re-run of the same run_id), so it can
          # never already exist when this step executes — which means the
          # later save step is never a same-key no-op (see that step for why
          # that matters). restore-keys is what does the actual restoring:
          # since the primary key can never hit, restore always falls
          # through to the prefix match, which the cache backend resolves to
          # the MOST RECENTLY CREATED entry under that prefix, i.e. whatever
          # this workflow saved last run. That pairing (a save key that can
          # never collide, a restore that always finds the newest) is the
          # standard "rolling cache" idiom for state that should accumulate
          # across every run.
          key: state-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            state-db-

      - name: Validate restored archive (or confirm a genuine cold start)
        env:
          MATCHED_KEY: ${{ steps.restore-cache.outputs.cache-matched-key }}
        run: |
          # `cache-hit` (exact match) is meaningless here by construction:
          # the primary key above always embeds this run's own id, so it can
          # never already exist. `cache-matched-key` is the real signal —
          # set when actions/cache/restore fell through to restore-keys and
          # found *some* prior entry, empty when it found nothing at all.
          if [ -z "$MATCHED_KEY" ]; then
            # A cache miss here means either this is genuinely the first run
            # ever, or every prior state-db-* entry has aged out (GitHub
            # evicts a cache entry 7 days after it was last restored FROM;
            # this rolling scheme only ever restores from the single newest
            # entry, so every older one stops being touched the moment a
            # newer save lands and ages out on its own clock — see the save
            # step). Either way, this is the one case where a miss is
            # allowed to be silent: there is no prior archive to have lost.
            echo "No cached archive found (cache-matched-key empty) -- legitimate cold start. Starting fresh."
            echo "ARCHIVE_ROWS_BEFORE=0" >> "$GITHUB_ENV"
          else
            # A match was found and actions/cache/restore has already
            # downloaded it to data/state.db; a transport-level failure at
            # this point (corrupt download, truncated segment) fails this
            # step outright rather than silently reporting a miss, so
            # reaching this branch means the bytes on disk are genuinely
            # what the cache held. Still run the same on-disk integrity
            # check the old HTTP-restore path used, since that check exists
            # to catch a bad SAVE (a corrupt DB written by a prior run), not
            # just a bad transfer.
            if ! rows=$(python scripts/archive_guard.py validate data/state.db); then
              echo "::error::Cached archive (key: $MATCHED_KEY) failed validation (corrupt, truncated, or missing the core table)."
              echo "Aborting deliberately: proceeding with a broken archive would overwrite the real production archive at save time."
              exit 1
            fi
            echo "Restored prior archive from cache (key: $MATCHED_KEY, $rows rows, $(stat -c%s data/state.db) bytes)."
            echo "ARCHIVE_ROWS_BEFORE=$rows" >> "$GITHUB_ENV"
          fi

      - name: Ingest latest signals
        run: ma-signal-monitor

      - name: Backfill categorization under current taxonomy
        run: ma-signal-backfill --rescore

      - name: Generate Daily Briefing (and email if configured)
        env:
          DIGEST_ENABLED: ${{ secrets.SMTP_HOST != '' && 'true' || 'false' }}
          PUBLIC_BASE_URL: ${{ env.PAGES_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: ma-signal-digest

      - name: Build static site
        env:
          # Public giscus values (not secrets) live in repo Variables — Settings
          # → Secrets and variables → Actions → Variables. Actions doesn't expose
          # them to steps automatically, so map them in here for build_static.py.
          # Only REPO + REPO_ID + CATEGORY_ID gate the widget (giscus_enabled).
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY || 'General' }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          GISCUS_THEME: ${{ vars.GISCUS_THEME || 'light' }}
        run: |
          python scripts/build_static.py --base-path "$STATIC_BASE_PATH" --out site
          # Last line of defense: refuse to publish if the archive shrank
          # catastrophically since the restore step (see archive_guard.py for
          # the tolerance and the retention-pruning evidence behind it). This
          # exits nonzero on catastrophic shrink, which fails this step and,
          # by design, skips the save step below — a shrunk archive must
          # never become the next run's restore point.
          python scripts/archive_guard.py compare --before "$ARCHIVE_ROWS_BEFORE" --after data/state.db

      - name: Save archive DB to cache
        # Deliberately no `if:` override here (default is `if: success()`),
        # so a failure anywhere above — ingest, backfill, digest, build, or
        # the archive_guard.py compare shrink-guard — skips this step
        # exactly like it always skipped the old `cp` into site/. Saving
        # unconditionally (`if: always()`) would persist a catastrophically
        # shrunk or corrupt archive forward into the next run's restore
        # point, which is the one thing archive_guard.py compare exists to
        # prevent.
        uses: actions/cache/save@v5
        with:
          path: data/state.db
          key: state-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type: GitHub Actions) so the workflow is
          # self-bootstrapping — no manual Settings → Pages toggle needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
