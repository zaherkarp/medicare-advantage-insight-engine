name: Deploy Static Site

on:
  schedule:
    # Ingest + rebuild + deploy every 2 hours (at minute 25).
    - cron: "25 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - "scripts/build_static.py"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Don't run deploys concurrently, but let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Project Pages live under /<repo>; the archive DB is restored from the
      # previously published site so it accumulates across runs.
      STATIC_BASE_PATH: /${{ github.event.repository.name }}
      PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      WEBHOOK_MODE: test
      MIN_RELEVANCE_SCORE: ${{ vars.MIN_RELEVANCE_SCORE || '0.3' }}
      USER_AGENT: ${{ vars.USER_AGENT || 'MA-Signal-Monitor (research; contact via repo)' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # sgmllib3k won't build a wheel with modern pip; copy the module directly.
          pip download sgmllib3k --no-binary :all: -d /tmp/sgml
          tar xzf /tmp/sgml/sgmllib3k-*.tar.gz -C /tmp/sgml
          cp /tmp/sgml/sgmllib3k-*/sgmllib.py "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          pip install feedparser --no-deps
          pip install requests python-dotenv pyyaml
          pip install fastapi "uvicorn[standard]" jinja2 apscheduler httpx
          pip install . --no-deps

      - name: Restore archive DB from the published site
        run: |
          mkdir -p data
          if curl -fsSL "$PAGES_URL/data/state.db" -o data/state.db; then
            echo "Restored prior archive ($(stat -c%s data/state.db) bytes)."
          else
            echo "No prior archive found; starting fresh."
          fi

      - name: Ingest latest signals
        run: ma-signal-monitor

      - name: Generate Daily Briefing (and email if configured)
        env:
          DIGEST_ENABLED: ${{ secrets.SMTP_HOST != '' && 'true' || 'false' }}
          PUBLIC_BASE_URL: ${{ env.PAGES_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: ma-signal-digest

      - name: Build static site
        env:
          # Public giscus values (not secrets) live in repo Variables — Settings
          # → Secrets and variables → Actions → Variables. Actions doesn't expose
          # them to steps automatically, so map them in here for build_static.py.
          # Only REPO + REPO_ID + CATEGORY_ID gate the widget (giscus_enabled).
          GISCUS_REPO: ${{ vars.GISCUS_REPO }}
          GISCUS_REPO_ID: ${{ vars.GISCUS_REPO_ID }}
          GISCUS_CATEGORY: ${{ vars.GISCUS_CATEGORY || 'General' }}
          GISCUS_CATEGORY_ID: ${{ vars.GISCUS_CATEGORY_ID }}
          GISCUS_THEME: ${{ vars.GISCUS_THEME || 'light' }}
        run: |
          python scripts/build_static.py --base-path "$STATIC_BASE_PATH" --out site
          # Persist the DB inside the published site so the next run restores it.
          mkdir -p site/data
          cp data/state.db site/data/state.db

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type: GitHub Actions) so the workflow is
          # self-bootstrapping — no manual Settings → Pages toggle needed.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
