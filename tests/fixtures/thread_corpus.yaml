# A ~80-headline synthetic Medicare Advantage news window for
# tests/test_thread_quality.py (the emergent story-thread quality gate).
#
# Modeled on real MA trade-press phrasing across a 30-day window: a CMS
# advance-notice arc, a Star Ratings arc, an MLR/earnings arc, benefit-design
# and network moves, hospital contract disputes, broker/commission news,
# enrollment tallies, a couple of demographic stories, and a long tail of
# one-off stories with little lexical overlap to anything else in the window
# (nursing homes, telehealth, PBM reform, senior housing...). The long tail is
# deliberate: it is what makes 'ungrouped signals' a real, non-trivial
# fraction of the window instead of an artifact of a too-small test corpus.
#
# primary_category is one of the four tests/conftest.py sample_config
# categories (membership_movement, policy_regulatory, financial_pressure,
# competitive_strategy) or 'uncategorized'. entities only uses aliases from
# sample_config.watched_entities (UnitedHealthcare, Humana, Aetna, CMS) --
# other named companies (Elevance, Centene, CVS Health, GoHealth, ...) are
# left out of entities on purpose, mirroring how a narrower watch list would
# actually score them. Both fields are assigned by hand, independent of the
# real classifier/taxonomy, so this fixture is a pure unit-test input with no
# DB/HTTP/config-loading dependency.
#
# day_offset is days from the oldest day in a 30-day window (0-29).

