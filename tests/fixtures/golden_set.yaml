# Hand-labelled regression set for the relevance scorer, scored against the
# LIVE config/taxonomy.yaml. Each item is a realistic headline+summary labelled
# relevant (a genuine Medicare Advantage signal) or irrelevant (off-topic noise).
# tests/test_golden_set.py asserts precision/recall stay above floors, so a
# taxonomy or scoring change that would regress past judgments fails CI.
#
# Keep examples unambiguous and well-separated from the threshold; this guards
# against regressions, it is not a knife-edge benchmark.

relevant:
  - title: "CMS finalizes 2025 Star Ratings methodology for Medicare Advantage"
    summary: "The final rule changes risk adjustment and cut points affecting plan bonuses."
  - title: "Humana reports Medicare Advantage enrollment growth in Q3"
    summary: "Membership rose as the insurer expanded its service area into new counties."
  - title: "UnitedHealthcare flags rising medical loss ratio in MA business"
    summary: "Executives cited utilization and cost trend pressure on margins."
  - title: "Aetna exits several Medicare Advantage counties for 2025"
    summary: "The disenrollment will shift membership amid benefit reductions."
  - title: "CMS proposed rule targets prior authorization in Medicare Advantage"
    summary: "The proposed rule would tighten risk adjustment and audit practices."
  - title: "Humana and CVS Health expand value-based care partnership"
    summary: "The joint venture targets dual-eligible special needs plan members."
  - title: "Brokers warn of lead generation crackdown on MA marketing"
    summary: "New CMS marketing rules hit field marketing organizations and FMO agents."
  - title: "Centene posts Medicare Advantage margin pressure on benefit cuts"
    summary: "The insurer trimmed supplemental benefits as premium increases loomed."
  - title: "Star Ratings drop costs Elevance millions in MA bonus payments"
    summary: "Lower Stars reduce quality bonus revenue across the membership base."
  - title: "D-SNP enrollment surges among dual eligible seniors"
    summary: "The special needs plan growth reflects an aging population shift."

