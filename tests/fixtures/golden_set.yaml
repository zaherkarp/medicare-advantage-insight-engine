# Hand-labelled regression set for the relevance scorer, scored against the
# LIVE config/taxonomy.yaml. Each item is a realistic headline+summary labelled
# relevant (a genuine Medicare Advantage signal) or irrelevant (off-topic noise).
# tests/test_golden_set.py asserts precision/recall stay above floors, so a
# taxonomy or scoring change that would regress past judgments fails CI.
#
# Entries default to source_priority 3 (trusted, ungated MA source); an entry
# may set source_priority to exercise priority-dependent behavior such as the
# MA-context gate for broad priority-2 feeds.
#
# The set mixes easy, well-separated cases with hard near-threshold cases mined
# from the production archive (labelled with adversarial double-review). The
# "formerly known gaps" sections hold cases the scorer once misclassified —
# recall gaps (M&A sale/divestiture vocabulary, dry SEC 8-K titles, provider
# network drops) and precision gaps (ACA-marketplace/Medicaid-rule/FFS-payment
# stories with no MA angle) — all fixed in iteration 5 (taxonomy keyword
# cleanup, soft exclusions, and the ma_boost_terms mechanism). They stay here
# as regression guards for exactly those fixes.


