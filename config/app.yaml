# MA Signal Monitor - Application Configuration
# Overrides for settings not in .env or for advanced tuning.

app:
  name: "MA Signal Monitor"
  version: "0.1.0"

# Delivery settings
delivery:
  # Maximum retries for webhook delivery
  max_retries: 3
  # Backoff base in seconds (exponential: base * 2^attempt)
  retry_backoff_base: 2
  # Timeout per request in seconds
  timeout: 30
  # Batch size: how many alerts per webhook message (0 = all in one)
  batch_size: 1
  # Near-duplicate alert suppression. Stops the same story republished by
  # several sources from firing multiple webhook alerts. Only the alert
  # stream is trimmed — every scored item is still archived.
  dedup:
    enabled: true
    # Title-token Jaccard at/above this is treated as the same story (0.0-1.0).
    similarity_threshold: 0.6
    # Also suppress vs. alerts delivered in the last N days (0 = within-run only).
    lookback_days: 3

# Processing settings
processing:
  # Minimum relevance score to generate an alert (0.0 - 1.0)
  min_relevance_score: 0.3
  # Public archive display floor (0.0 - 1.0). Sub-floor stories stay in the DB
  # but are hidden from the feed, topic/state pages, search, and static site.
  # Filters pure source-priority "noise" (no keyword and no entity match).
  # Set to 0.0 to surface everything, as before.
  archive_min_score: 0.1
  # Maximum age of items to process (in days, 0 = no limit)
  max_item_age_days: 7
  # Maximum summary length in characters
  max_summary_length: 500
  # Feed near-duplicate grouping. Labels the same story carried by several
  # sources so the browsable feed shows one representative (the archive keeps
  # every row; /status and /health report the full counts). Shares the
  # similarity threshold with delivery.dedup.
  story_dedup:
    enabled: true
    lookback_days: 3

# Storage settings
storage:
  # How long to keep seen items in days (for dedupe)
  seen_item_retention_days: 90
  # How long to keep delivery logs in days
  delivery_log_retention_days: 30
