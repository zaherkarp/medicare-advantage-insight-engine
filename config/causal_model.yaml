# MA Signal Monitor — Declared Causal Model of the Medicare Advantage market
#
# This is a DECLARED, citable, evidence-based model — not a statistically
# inferred one. The six taxonomy categories are arranged into ordered causal
# layers (policy/demographic drivers -> economic pressure -> strategic
# response -> market outcomes), and every edge names the real source types that
# document the relationship. The Angles page reads this file to rank lens
# intersections that lie ALONG a causal edge above incidental overlaps; nothing
# here trains, fits, or infers anything.
#
# Two invariants keep the model sound:
#   * Edges are downstream-only: every edge points from an earlier layer to a
#     later one, so the graph is acyclic BY CONSTRUCTION — no cycle check needed.
#   * config.py's _validate_config rejects an unsound model at load time
#     (unknown / self / duplicate / non-downstream edges, weight outside [0,1],
#     blank evidence, a category placed in more than one layer).
# Full taxonomy COVERAGE — every category in taxonomy.yaml placed in exactly one
# layer — is enforced by tests/test_causal_model.py against this shipped file,
# so adding a taxonomy category fails the suite until it is placed here.
#
# `evidence` is a one-sentence, source-naming rationale kept for public display;
# tests assert it is non-empty, not that its content is correct. `weight` (0-1)
# scales the ranking boost an on-edge intersection earns — higher means a
# stronger, better-evidenced link (e.g. policy->financial 1.0 outranks
# demographic->financial 0.6 at equal story volume).

# Layers in causal order (top-to-bottom order IS the order used for the
# downstream-only edge check; short labels drive the compact layer badges).
layers:
  structural_policy_drivers:
    label: "Structural & Policy Drivers"
    short: "Drivers"
    categories:
      - policy_regulatory
      - demographic_shifts
  economic_pressure:
    label: "Economic Pressure"
    short: "Pressure"
    categories:
      - financial_pressure
  strategic_response:
    label: "Strategic Response"
    short: "Response"
    categories:
      - competitive_strategy
      - brokerage_distribution
  market_outcomes:
    label: "Market Outcomes"
    short: "Outcomes"
    categories:
      - membership_movement

# Directed, weighted, downstream-only edges between taxonomy categories.
edges:
  - source: policy_regulatory
    target: financial_pressure
    weight: 1.0
    evidence: "CMS rate announcements and final rules reset MA benchmarks and risk-adjustment factors that payers cite as margin drivers in their 10-K and 8-K guidance, a linkage documented across MedPAC's March reports to Congress on MA payment and CMS final-rule impact analyses."
  - source: demographic_shifts
    target: financial_pressure
    weight: 0.6
    evidence: "Shifts in the aging and dual-eligible Medicare population change plan risk pools and utilization in ways payers discuss in 10-K medical-cost commentary and that ATI Advisory D-SNP analyses examine."
  - source: demographic_shifts
    target: membership_movement
    weight: 0.7
    evidence: "Age-in and dual-eligible population growth expands the addressable MA membership base, a trend tracked in KFF MA enrollment analyses and ATI Advisory D-SNP analyses."
  - source: financial_pressure
    target: competitive_strategy
    weight: 0.9
    evidence: "Margin and medical-loss-ratio pressure reported through payer 10-K and 8-K guidance cycles is often followed by the benefit, network, and partnership repositioning described in the same filings."
  - source: policy_regulatory
    target: competitive_strategy
    weight: 0.7
    evidence: "CMS changes to Star Ratings, risk adjustment, and plan rules shift the competitive terms that payers describe as strategic responses in 10-K filings and that CMS final-rule impact analyses assess."
  - source: policy_regulatory
    target: brokerage_distribution
    weight: 0.8
    evidence: "CMS marketing final rules revise agent-broker compensation and third-party-marketing-organization requirements, changes reflected in e-broker earnings reports and CMS final-rule impact analyses."
  - source: competitive_strategy
    target: membership_movement
    weight: 0.9
    evidence: "Benefit-design, network, and partnership moves shape the plan choices that surface as enrollment and switching, as analyzed in KFF MA enrollment and switching analyses."
  - source: brokerage_distribution
    target: membership_movement
    weight: 0.7
    evidence: "Broker and e-broker distribution activity during the Annual Enrollment Period channels plan selection, a relationship visible in e-broker earnings reports and KFF MA enrollment and switching analyses."
