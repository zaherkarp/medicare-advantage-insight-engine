# MA Signal Monitor - Source Configuration
# Each source has a name, type, URL, priority (1-5, higher = more important),
# and an enabled flag.
#
# Optional fields surfaced on the public Sources directory and State
# Intelligence pages:
#   state        USPS code or "national" (geography this source covers)
#   geography    free-text region label (e.g. "Southeast")
#   cadence      human ingestion cadence; blank uses the global default
#   description  one-line "what this source covers"
#   homepage     public landing page (distinct from the raw feed url)

sources:
  # --- CMS / Government ---
  - name: "CMS Newsroom"
    type: rss
    url: "https://www.cms.gov/newsroom/rss-feeds"
    priority: 5
    enabled: true
    tags: ["cms", "policy", "regulatory"]
    state: "national"
    homepage: "https://www.cms.gov/newsroom"
    description: "Official CMS press releases, fact sheets, and policy announcements."

  - name: "Federal Register - CMS Rules"
    type: rss
    url: "https://www.federalregister.gov/documents/search.rss?conditions%5Bagencies%5D%5B%5D=centers-for-medicare-medicaid-services&conditions%5Btype%5D%5B%5D=RULE&conditions%5Btype%5D%5B%5D=PRORULE"
    priority: 5
    enabled: true
    tags: ["regulatory", "cms", "rules"]
    state: "national"
    homepage: "https://www.federalregister.gov/agencies/centers-for-medicare-medicaid-services"
    description: "Proposed and final CMS rules as published in the Federal Register."

  # --- Industry News ---
  - name: "Healthcare Dive"
    type: rss
    url: "https://www.healthcaredive.com/feeds/news/"
    priority: 3
    enabled: true
    tags: ["industry", "general"]
    state: "national"
    homepage: "https://www.healthcaredive.com/"
    description: "Daily healthcare business and policy news for industry professionals."

  - name: "Modern Healthcare"
    type: rss
    url: "https://www.modernhealthcare.com/arc/outboundfeeds/rss/"
    priority: 3
    enabled: true
    tags: ["industry", "general"]
    state: "national"
    homepage: "https://www.modernhealthcare.com/"
    description: "Business news covering payers, providers, and health policy."

  - name: "Fierce Healthcare"
    type: rss
    url: "https://www.fiercehealthcare.com/rss/xml"
    priority: 3
    enabled: true
    tags: ["industry", "general"]
    state: "national"
    homepage: "https://www.fiercehealthcare.com/"
    description: "Coverage of payers, health tech, and the Medicare Advantage market."

  - name: "KFF Health News"
    type: rss
    url: "https://kffhealthnews.org/feed/"
    priority: 4
    enabled: true
    tags: ["policy", "analysis"]
    state: "national"
    homepage: "https://kffhealthnews.org/"
    description: "Nonprofit newsroom reporting on health policy and Medicare/Medicaid."

  # --- Research / Policy ---
  - name: "Georgetown CCF"
    type: rss
    url: "https://ccf.georgetown.edu/feed/"
    priority: 4
    enabled: true
    tags: ["research", "policy"]
    state: "national"
    homepage: "https://ccf.georgetown.edu/"
    description: "Georgetown Center for Children and Families — Medicaid/CHIP research."

  # --- State Intelligence ---
  - name: "STAT News"
    type: rss
    url: "https://www.statnews.com/feed/"
    priority: 3
    enabled: true
    tags: ["industry", "policy"]
    state: "national"
    homepage: "https://www.statnews.com/"
    description: "Health, medicine, biotech, and health-policy news and analysis."

  - name: "Colorado Newsline"
    type: rss
    url: "https://coloradonewsline.com/feed/"
    priority: 2
    enabled: true
    tags: ["state", "policy"]
    state: "CO"
    geography: "Colorado"
    homepage: "https://coloradonewsline.com/"
    description: "Colorado policy newsroom (incl. health and human services)."

  # --- SEC / Financial (EDGAR Atom feeds for watched MA payers) ---
  # SEC requests a descriptive User-Agent with contact info; set USER_AGENT.
  - name: "SEC EDGAR - UnitedHealth Group"
    type: sec
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000731766&type=8-K&dateb=&owner=include&count=20&output=atom"
    priority: 4
    enabled: true
    tags: ["financial", "sec"]
    state: "national"
    homepage: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000731766"
    description: "UnitedHealth Group 8-K material-event filings."

  - name: "SEC EDGAR - Humana"
    type: sec
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000049071&type=8-K&dateb=&owner=include&count=20&output=atom"
    priority: 4
    enabled: true
    tags: ["financial", "sec"]
    state: "national"
    homepage: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000049071"
    description: "Humana 8-K material-event filings."

  - name: "SEC EDGAR - CVS Health"
    type: sec
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000064803&type=8-K&dateb=&owner=include&count=20&output=atom"
    priority: 4
    enabled: true
    tags: ["financial", "sec"]
    state: "national"
    homepage: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000064803"
    description: "CVS Health (Aetna) 8-K material-event filings."
