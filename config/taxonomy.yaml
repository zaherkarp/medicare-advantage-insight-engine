# MA Signal Monitor - Trigger Taxonomy Configuration
# Each category has a name, description, keywords, and weight.
# Keywords are used for initial classification. Weights influence scoring.

categories:
  membership_movement:
    label: "Membership Movement"
    description: "Payer gains/losses, market share, enrollment, county/region expansion or exit, contract consolidation"
    weight: 1.0
    keywords:
      - "enrollment"
      - "membership"
      - "market share"
      - "disenrollment"
      - "county expansion"
      - "county exit"
      - "service area"
      - "contract consolidation"
      - "new members"
      - "member growth"
      - "member loss"
      - "plan exits"
      - "plan entry"
      - "open enrollment"
      - "annual enrollment"
      - "special enrollment"

  demographic_shifts:
    label: "Demographic Shifts"
    description: "Aging Medicare population, dual growth, SNP growth, regional demographic shifts"
    weight: 0.8
    keywords:
      - "aging population"
      - "dual eligible"
      - "dual-eligible"
      - "D-SNP"
      - "DSNP"
      - "special needs plan"
      - "SNP"
      - "chronic condition"
      - "C-SNP"
      - "I-SNP"
      - "institutional"
      - "baby boomer"
      - "65 and older"
      - "Medicare eligible"
      - "demographic"

  policy_regulatory:
    label: "Policy / Regulatory Changes"
    description: "CMS rules, Stars changes, risk adjustment, chart review, bid changes"
    weight: 1.2
    keywords:
      - "CMS"
      - "proposed rule"
      - "final rule"
      - "star rating"
      - "Stars"
      - "risk adjustment"
      - "V28"
      - "chart review"
      - "benchmark"
      - "Part C"
      - "Part D"
      - "RADV"
      - "HCC"
      - "OIG"
      - "overpayment"
      - "upcoding"
      - "fraud"
      - "settlement"
      - "advance notice"
      - "rate notice"
      - "rate announcement"
      - "rulemaking"
      - "MLR requirement"
      # Removed (2026-07-03, iteration 5): bare "regulation"/"regulatory"
      # (utility-docket and state-politics noise), "bid" (court/bond bids),
      # and the ACA-marketplace vocabulary ("ACA", "Affordable Care Act",
      # "marketplace", "individual market", "insurance exchange", "health
      # insurance exchange", "healthcare reform", "health reform", "single
      # risk pool", "public option", "universal coverage") — those stories
      # are out of scope for an MA tracker and were the largest labeled
      # false-positive class. Guarded by golden-set irrelevant entries.

  financial_pressure:
    label: "Financial / Operating Pressure"
    description: "Margin pressure, MLR, benefit reductions, premium increases, cost trends"
    weight: 1.0
    keywords:
      - "margin"
      - "medical loss ratio"
      - "MLR"
      - "benefit reduction"
      - "benefit cut"
      - "premium increase"
      - "premium"
      - "cost trend"
      - "utilization"
      - "medical cost"
      - "operating loss"
      - "earnings"
      - "revenue"
      - "profit"
      - "guidance"
      - "supplemental benefit"
      - "PMPM"
      - "bankruptcy"
      - "Chapter 11"
      - "restructuring"
      - "going concern"
      - "net loss"
      - "8-K"

  competitive_strategy:
    label: "Competitive / Operational Strategy"
    description: "Partnerships, vendor changes, care delivery, network strategy"
    weight: 0.9
    keywords:
      - "partnership"
      - "acquisition"
      - "merger"
      - "joint venture"
      - "divestiture"
      - "divest"
      - "sale"
      - "sell"
      - "vendor"
      - "platform"
      - "value-based"
      - "VBC"
      - "ACO"
      - "care delivery"
      - "network"
      - "out of network"
      - "contract dispute"
      - "telehealth"
      - "home health"
      - "primary care"
      - "pharmacy"
      - "PBM"
      - "vertical integration"
      # Removed (2026-07-03, iteration 5): bare "provider" — matches any
      # hospital/clinician story; genuine payer-network signals carry
      # "network"/"out of network"/"contract dispute" instead.

  brokerage_distribution:
    label: "Brokerage / Distribution"
    description: "MA broker/agent distribution, FMOs, lead-gen, e-brokers, roll-ups, AEP marketing, brokerage restructuring"
    weight: 0.9
    keywords:
      - "broker"
      - "brokerage"
      - "insurance agent"
      - "FMO"
      - "field marketing organization"
      - "lead generation"
      - "distribution"
      - "e-broker"
      - "call center"
      - "captive agent"
      - "roll-up"
      - "broker commission"
      - "agent commission"
      # Removed (2026-07-03, iteration 5): bare "commission" — Public
      # Service/election/county commissions dominated its matches.
      - "Annual Enrollment Period"
      - "AEP"
      - "marketing organization"

# Medicare Advantage context anchors. For broad, low-priority sources (see
# scoring.ma_context_min_priority), an item must contain a watched payer OR one
# of these core Medicare/MA terms before its taxonomy-keyword matches count as
# signal. This stops generic keyword hits ("premium", "network", "earnings")
# from statewide-news firehoses scoring as MA relevance while they say nothing
# about Medicare. Whole-token matched (same matcher as keywords). High-priority
# MA sources (CMS, KFF, Fierce, …) are exempt and stay fully sensitive.
ma_context_terms:
  - "Medicare"
  - "Medicare Advantage"
  - "Medicare Part"
  - "Part C"
  - "Part D"
  - "MA plan"
  - "dual eligible"
  - "dual-eligible"
  - "D-SNP"
  - "C-SNP"
  - "I-SNP"
  - "special needs plan"
  - "Medigap"
  - "risk adjustment"
  - "star rating"
  - "CMS"
  - "Centers for Medicare"

# Strong MA-plan vocabulary. Any one match adds scoring.ma_term_boost once —
# core MA terms are direct relevance evidence even when no category keyword
# matches (e.g. "Fairview to drop UnitedHealthcare Medicare Advantage").
# Deliberately narrower than ma_context_terms: bare "Medicare"/"CMS" establish
# context but are not themselves evidence of an MA-market signal.
ma_boost_terms:
  - "Medicare Advantage"
  - "MA plan"
  - "Part C"
  - "D-SNP"
  - "C-SNP"
  - "I-SNP"
  - "dual eligible"
  - "dual-eligible"
  - "Medigap"

# Named entities (payers) to watch for - boosts relevance when detected
watched_entities:
  - "UnitedHealthcare"
  - "UnitedHealth"
  - "UHC"
  - "Optum"
  - "Humana"
  - "CVS Health"
  - "Aetna"
  - "Cigna"
  - "Elevance"
  - "Anthem"
  - "Centene"
  - "WellCare"
  - "Molina"
  - "Kaiser"
  - "SCAN"
  - "Devoted Health"
  - "Clover Health"
  - "Alignment Healthcare"
  - "Oscar Health"
  - "Blue Cross"
  - "Blue Shield"
  - "BCBS"
  - "CareSource"
  - "Bright Health"
  - "GoHealth"
  - "eHealth"
  - "eHealthInsurance"
  - "SelectQuote"
  - "Gyde"
  - "Ezekiel Emanuel"
  - "Zeke Emanuel"
  - "Mark Bertolini"
  - "Bailey & Co"

# Exclusion keywords (whole-token, case-insensitive — same matcher as above).
#   hard: a match vetoes the item to score 0 (still archived, with the reason).
#         Keep this list short and surgical — only unambiguous off-topic noise.
#   soft: each match subtracts scoring.exclusion_penalty from the score.
# Populate from `ma-signal-feedback mine-keywords` exclusion candidates, then
# review by hand. Empty by default so behaviour is unchanged until you add terms.
exclusions:
  hard: []
  soft:
    # Medicare FFS provider-payment machinery — not MA-plan signals. ("Home
    # Health Value-Based Purchasing" is an FFS program name; MA stories say
    # "value-based care", which still matches the value-based keyword.)
    - "prospective payment system"
    - "provider enrollment"
    - "value-based purchasing"
    # Medicaid-eligibility policy news that brushes "final rule"/"CMS".
    - "work requirements"
    # State rural-health grant/program stories that brush "CMS" with no MA
    # angle; genuine MA-rural stories carry MA terms/keywords that outweigh
    # this penalty.
    - "rural health"
    # Reproductive-health litigation/telehealth stories that brush
    # "telehealth"; effectively never MA-relevant.
    - "abortion"
    - "mifepristone"

# Scoring configuration
scoring:
  keyword_match_base: 0.15
  entity_match_boost: 0.20
  source_priority_weight: 0.10
  multi_category_boost: 0.10
  title_keyword_multiplier: 1.5
  exclusion_penalty: 0.25
  # Added once when any ma_boost_terms entry is present (see that list above).
  ma_term_boost: 0.15
  # Sources with priority below this must carry Medicare/MA context (a watched
  # payer or an ma_context_terms match) before keyword matches count. At 5 only
  # the two priority-5 feeds stay exempt — CMS Newsroom and Federal Register CMS
  # Rules, both of which publish CMS material by definition. 0 disables the gate.
  #
  # Raised 3 -> 5 (2026-08-04). Everything from priority 3 up was exempt, and
  # that is where essentially all the noise lived. Split by source bucket at the
  # old threshold, on the real production archive's default 30-day display-floor
  # window (382 displayed stories, non-duplicate): exempt (priority >= 3) 355
  # stories / 157 off-domain (44.2%) vs. gated (priority < 3) 27 stories /
  # 1 off-domain (3.7%). The gate worked; it applied to 7% of the archive.
  # Re-scoring that window through score_item at each candidate threshold:
  #   gate  displayed  on-domain  off-domain  noise share
  #     3        382        224         158       41.4%   <- was
  #     4        247        224          23        9.3%
  #     5        228        224           4        1.8%   <- now
  # "on-domain" = mentions Medicare/CMS/a watched payer, i.e. nearly the same
  # predicate the gate itself applies — so that column can't by construction
  # show a recall loss (it would read 224/224 even if the gate were wrongly
  # eating relevant stories). It is not proof recall held, only that measured
  # on-domain stories weren't the ones dropped. tests/test_golden_set.py's
  # precision/recall floors are the independent check, and were extended
  # alongside this change to probe the newly-gated tiers through several
  # different context anchors (payer-only, bare "Medicare", "CMS"-only,
  # "risk adjustment"-only) so a later trim of ma_context_terms cannot quietly
  # break recall.
  #
  # 4 was implemented first and rejected on measurement. Its 23 residual
  # off-domain stories break down by source priority as 19 at priority 4,
  # 2 at priority 5, 1 at priority 3, 1 at priority 2 — i.e. the great
  # majority sat in exactly the tier 4 spares (KFF Health News 6, House Energy
  # & Commerce 6, House Ways & Means 3, Georgetown CCF 2, Federal Register CMS
  # Notices 1, CMS MLN Connects 1). Two scored ABOVE the 0.3 alert threshold:
  # "Chairman Smith Statement on Fed Rate Announcement" (0.35) and a
  # fraud-crackdown piece (0.85). Moving to 5 gates those 19; the 4 survivors
  # are all below alert grade and two are genuine CMS Federal Register items.
  # The recall concern that motivated 4 — dry SEC/litigation filings carrying
  # no incidental "Medicare"/"CMS" text — did not materialise: the golden set
  # holds 1.000/1.000 with zero false negatives at 3, 4 and 5 alike.
  #
  # WHAT THIS DOES NOT FIX. The gate tests for Medicare *context*, and
  # ma_context_terms deliberately includes bare "Medicare" and "CMS". Stories
  # that are Medicare-adjacent but not Medicare Advantage — 340B, MSSP shared
  # savings (fee-for-service), Medicaid 1115 waivers, provider taxes — clear it
  # by design. That band is 104 stories and does not move at ANY threshold:
  # 27.2% of the window at gate 3, 45.6% at gate 5, rising only because the
  # denominator shrinks. Narrowing it needs a different lever — an
  # ma_boost_terms-anchored gate, or FFS/Medicaid exclusion vocabulary — which
  # is the owner-reviewed "Populate exclusions.hard" item in TODO.md and is
  # deliberately not front-run here.
  ma_context_min_priority: 5
